<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="profile-container">

  <div id="studentProfile"></div>

  <h2>Issued Books</h2>

  <table>
    <thead>
      <tr>
        <th>Serial No</th>
        <th>Book Name</th>
        <th>Author Name</th>
        <th>Issued Date</th>
        <th>Due Date</th>
        <th>Returned Date</th>
      </tr>
    </thead>

    <tbody id="issuedBooksTable"></tbody>
  </table>

  <button onclick="showIssueForm()">Issue The Book</button>

  <div id="issueForm"></div>

</div>

<script src="profile.js"></script>

</body>
</html>
